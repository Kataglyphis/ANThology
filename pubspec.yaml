name: anthology
description: "Central modular code for my flutter/dart projects."
version: 2.0.0
homepage: https://jonasheinle.de

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Needed by the generated AnthologyLocalizations (see l10n.yaml).
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  csv: ^8.0.0
  url_launcher: ^6.3.2
  go_router: ^18.0.0
  markdown: ^7.3.1
  markdown_widget: ^2.3.2+8
  flutter_highlighter: ^0.1.1
  font_awesome_flutter: ^11.0.0
  fl_chart: ^1.2.0
  mime: ^2.0.0
  web: ^1.1.1
  flutter_markdown_plus: ^1.0.7
  sqlite3: ^3.3.1
dev_dependencies:
  mockito: ^5.7.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # The generated lib/l10n/ Dart is committed too: a consumer's `flutter pub get` never runs gen-l10n for it.
  generate: true
  uses-material-design: true

  # Shared by both apps as packages/anthology/assets/...; the footer legal texts must stay in this one place.
  assets:
    - assets/documents/blog/
    - assets/documents/footer/
    - assets/images/
    - assets/images/aiBlog/
    - assets/images/books/
    - assets/images/cats/
    - assets/images/Pages/AboutMe/
    # One file, not the directory: it is the only portrait either app names.
    - assets/images/Pages/AboutMe/Bewerbungsbilder/a95a64ca_runterskaliert.jpg
    - assets/images/Pages/Data/
    - assets/images/Pages/Error/

  # Nested under `flutter:` (top-level is silently ignored); use `packages/anthology/<family>` or `package: 'anthology'`.
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat/static/Montserrat-Thin.ttf
          weight: 100
        - asset: assets/fonts/Montserrat/static/Montserrat-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Montserrat/static/Montserrat-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Montserrat/static/Montserrat-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Montserrat/static/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat/static/Montserrat-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Montserrat/static/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat/static/Montserrat-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Montserrat/static/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat/static/Montserrat-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Montserrat/static/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat/static/Montserrat-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Montserrat/static/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat/static/Montserrat-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Montserrat/static/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat/static/Montserrat-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Montserrat/static/Montserrat-Black.ttf
          weight: 900
        - asset: assets/fonts/Montserrat/static/Montserrat-BlackItalic.ttf
          weight: 900
          style: italic
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Thin.ttf
          weight: 100
        - asset: assets/fonts/Roboto/Roboto-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Roboto/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto/Roboto-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto/Roboto-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto/Roboto-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto/Roboto-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Roboto/Roboto-Black.ttf
          weight: 900
        - asset: assets/fonts/Roboto/Roboto-BlackItalic.ttf
          weight: 900
          style: italic
