# Generated Dart is committed (consumers never run gen-l10n); no `synthetic-package`, which gen-l10n now rejects.
arb-dir: lib/l10n
template-arb-file: anthology_en.arb
output-localization-file: anthology_localizations.dart
output-class: AnthologyLocalizations
# Flutter 3.50's gen-l10n still emits flutter_localizations' deprecated Material and Cupertino delegates; drop this once it does not.
header: "// ignore_for_file: deprecated_member_use"
