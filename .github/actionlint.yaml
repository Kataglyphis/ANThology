# ubuntu-26.04/-arm are GitHub preview labels (family-wide since 2026-09-06) that
# the pinned actionlint 1.7.12 - still the latest release - predates. This only
# ADDS labels to actionlint's built-in list; it disables no rule and silences no
# finding. Without it, docs.yml's `runs-on: ubuntu-26.04` is reported as an
# unknown label and the workflow gate fails on a runner that demonstrably exists.
#
# actionlint discovers this file by path, relative to the repo it is linting, so
# every consumer in the family carries these same five lines (ANTfrastructure,
# OrchestrANT, BeschleunigerBallett). That per-consumer copy is already reported
# upstream as a candidate for lint-workflows.sh to own - it could fall back to
# the hub's config when the consumer ships none - and this file should be deleted
# the day it does.
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm
