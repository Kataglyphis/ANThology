name: Lint gates - shell, workflows, secrets

# THE GATE THIS REPOSITORY HAD NONE OF. Before this file ANThology ran no lint
# of any kind - no shellcheck, no actionlint, and, the reason this one is
# urgent, no secret scan at all, while dart.yml pushes ./doc/api/ to a live FTP
# target with three repository secrets (SERVER, USERNAME, PW) on every push to
# main. It is also this repository's first pull_request check: dart.yml triggers
# on push only, so nothing was graded before a merge.
#
# NO LOCAL WRAPPER, and that is a decision rather than an omission. The four
# repos already on these gates each keep a thin run-lint-gates.sh whose only job
# is to source the canonical bootstrap and exec the hub runner. That bootstrap
# (ANTfrastructure shared/linux/templates/antfrastructure.sh) resolves the hub at
# <repo>/third_party/ANTfrastructure and, when it is absent, tells the reader to
# run `git submodule update --init --recursive third_party/ANTfrastructure`.
# ANThology has no .gitmodules - the checkout step in dart.yml says so - so that
# path can never exist here and that instruction would be a lie. A wrapper
# written any other way would be a sixth bootstrap variant, which is the exact
# thing the template's own header records the family spending effort to
# eliminate. So this lane checks the tooling out the SAME way dart.yml already
# does and calls the hub runner directly; there is nothing left for a wrapper to
# wrap. Replace this job with a `uses:` when ANTfrastructure grows a reusable lint
# lane, or with the wrapper pattern if ANThology ever grows the submodule.
#
# THE COST OF HAVING NO WRAPPER, stated rather than hidden: the other repos can
# point at one string that CI and a dev box both run. Here the local equivalent
# is the two commands below, with the hub checked out anywhere:
#
#     git clone --depth 1 https://github.com/Kataglyphis/ANTfrastructure
#     bash ANTfrastructure/linux/scripts/run-lint-gates.sh "$(pwd)"
#
# ALL FOUR GATES APPLY. The hub runner refuses to report green over an empty
# file list, and both refusals this lane used to hit are gone: it grew a
# scripts/renovate-local.sh for shellcheck to grade, and the runner learned that
# a scope with no *.py is an answer rather than a failure. The shared-config
# drift gate passes over the explicit empty .antfrastructure-shared.manifest,
# which records that this repo copies nothing from ANTfrastructure.
#
# NOT WIRED INTO dart.yml's DEPLOY YET. The sibling Dart repo makes its deploy
# job `needs:` its lint job, on the argument that a gate running beside a live FTP
# push can only report a problem the world has already been served - and that is
# the right end state here too. It needs the lint job to move into dart.yml
# first: `needs:` does not cross workflow files, and this gate is its own file
# because dart.yml is the deploy.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-gates:
    name: 🧹 shell + workflow + secret lint
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      # No container and no image reference anywhere in this job, unlike
      # dart.yml: the gate binaries are bootstrapped by the hub runner from
      # ANTfrastructure's own versions.env at pinned versions -- shellcheck,
      # actionlint and gitleaks additionally SHA256-verified, ruff version-pinned
      # and fetched through uvx -- so the verdict does not depend on what a base
      # image happens to ship.
      # fetch-depth 1 is enough - every scope comes from `git ls-files`, not
      # from history. No submodules: ANThology has none.
      - name: 🚚 Check out
        uses: actions/checkout@v6.0.0
        with:
          fetch-depth: 1

      # The same mechanism dart.yml uses to reach the shared Dart gate, for the
      # same reason: ANThology has no ANTfrastructure submodule, so CI checks the
      # shared tooling out itself. It lands inside the workspace but is
      # untracked there, so `git ls-files` cannot see it and no gate grades it.
      - name: 🚚 Get ANTfrastructure tooling
        uses: actions/checkout@v6.0.0
        with:
          repository: Kataglyphis/ANTfrastructure
          ref: main
          path: antfrastructure-tools

      # The consumer root is passed EXPLICITLY and is never inferred upstream:
      # the runner sits inside the workspace here, and a self-derived root would
      # make all four gates grade ANTfrastructure's tree and report green over the
      # wrong repository.
      - name: Lint gates
        run: bash antfrastructure-tools/linux/scripts/run-lint-gates.sh "${{ github.workspace }}"
