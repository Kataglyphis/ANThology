name: Docs · deploy

on:
  push:
    branches: ["main", "develop"]
  # Pull requests too: the gates below are this repo's only pre-merge verdict.
  pull_request:
    branches: ["main", "develop"]

jobs:
  # In this file so `build` can need it (needs: does not cross files); local twin in AGENTS.md section 5.
  lint:
    name: 🧹 lint gates
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      # No container: the hub runner bootstraps its pinned gate binaries itself.
      - name: 🚚 Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # No submodule, so CI checks the tooling out; it stays untracked, so no gate grades it.
      - name: 🚚 Get ANTfrastructure tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kataglyphis/ANTfrastructure
          ref: develop
          path: antfrastructure-tools

      # The root is explicit: a self-derived one would grade ANTfrastructure's tree instead.
      - name: Lint gates
        run: bash antfrastructure-tools/linux/scripts/run-lint-gates.sh "${{ github.workspace }}" --ratchets

  build:
    name: 🚀 Deploy website on push
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # The deploy job is gated on the lint job: see the block above `lint:`.
    needs: lint
    permissions:
      contents: read

    # No image reference: an omitted `image:` input defaults to the family ref, gated against versions.env upstream.

    steps:
      # No registry inputs: the image is public and this repo has no GHCR_PAT secret.
      - name: 🚚 Prepare CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          submodules: 'false'

      # The gate script comes from here, the Flutter toolchain from the image; find-hub.sh probes this path first.
      - name: 🚚 Get ANTfrastructure tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kataglyphis/ANTfrastructure
          ref: develop
          path: antfrastructure-tools

      # Via run-dart-checks.sh so the gate runs the same locally; the image's Flutter must satisfy pubspec's floor.
      - name: Dart checks (format, analyze, test) + build docs
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          # `image:` omitted on purpose - see the note above `steps:`.
          extra-args: --platform "linux/amd64"
          script: bash -c 'bash scripts/run-dart-checks.sh && dart doc'

      # Push only: a PR must never reach the live doc domain (ANTfrastructure docs/ftp-deploys.md).
      - name: 📂 Sync files to doc domain
        if: github.event_name == 'push'
        uses: Kataglyphis/ANTfrastructure/.github/actions/deploy-over-ftp@develop
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PW }}
          local-dir: ./doc/api/
