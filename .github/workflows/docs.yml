name: Docs · deploy

permissions:
  contents: read

on:
  push:
    branches: ["main", "develop"]
  # Pull requests too: the gates below are this repo's only pre-merge verdict.
  pull_request:
    branches: ["main", "develop"]

jobs:
  # Local twin in AGENTS.md section 5.
  lint:
    name: 🧹 lint gates
    uses: Kataglyphis/ANTfrastructure/.github/workflows/lint-gates.yml@develop
    with:
      submodules: 'true'
      ratchets: true
      code-dupes-report: true

  checks:
    name: Dart checks
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read

    # No image reference: an omitted `image:` input defaults to the family ref, gated against versions.env upstream.

    steps:
      # No registry inputs: the image is public and this repo has no GHCR_PAT secret.
      - name: 🚚 Prepare CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          submodules: 'true'

      # Via run-dart-checks.sh so the gate runs the same locally; the image's Flutter must satisfy pubspec's floor.
      - name: Dart checks (format, analyze, test)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          # `image:` omitted on purpose - see the note above `steps:`.
          extra-args: --platform "linux/amd64"
          script: bash scripts/run-dart-checks.sh

      # Again in the image's Chrome, for the web halves (lib/Boot/, lib/Sqlite/); the @TestOn('vm') files sit out.
      - name: Dart checks in Chrome
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --platform "linux/amd64"
          script: bash scripts/run-dart-checks.sh --test-platform chrome

  # The hub's lane builds, link-checks and publishes the site; it publishes only a push to develop or main (https://github.com/Kataglyphis/ANTfrastructure/blob/develop/docs/docs-sites.md).
  docs:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/build-docs.yml@develop
    with:
      # A command, not builder: dartdoc, because that builder takes no guide list.
      command: bash scripts/build-docs.sh
      site-dir: doc/api
      hub-path: third_party/ANTfrastructure
    secrets:
      FTP_SERVER: ${{ secrets.SERVER }}
      FTP_USERNAME: ${{ secrets.USERNAME }}
      FTP_PASSWORD: ${{ secrets.PW }}
