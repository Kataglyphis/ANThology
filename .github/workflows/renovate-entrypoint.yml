name: Renovate entrypoint

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate-entrypoint:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/renovate-entrypoint.yml@develop

  renovate-bootstrap:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: bash scripts/tests/test-renovate-wrapper.sh
